services:
  inventory-service:
    build: .
    container_name: ecommerce-inventory-service
    ports:
      - "8002:8002"

    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - default
      - ecommerce-network

  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-inventory-postgres

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5435:5432"

    volumes:
      - ecommerce_inventory_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - default


networks:
  default:
    name: ecommerce-inventory-service_default

  ecommerce-network:
    name: ecommerce-network
    external: true


volumes:
  ecommerce_inventory_postgres_data:
    external: true
